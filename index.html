<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Rifa Navideña</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f3d2e; --card:#14513c; --gold:#f5c542; --red:#e0393e; --ink:#fff; --soft:#cfe8dc; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:Poppins,sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; }
  #descargar { font:600 1rem Poppins,sans-serif; background:var(--gold); color:var(--bg); border:0; border-radius:99px; padding:12px 22px; cursor:pointer; }
  .banner { width:100%; max-width:560px; background:linear-gradient(180deg, #1d6b50, var(--card) 40%); border:4px solid var(--gold); border-radius:24px; padding:22px 18px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  .tag { display:inline-block; background:var(--red); padding:4px 14px; border-radius:99px; font-weight:800; font-size:.8rem; letter-spacing:.1em; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(3rem,14vw,4.6rem); line-height:.9; margin:10px 0 2px; color:var(--gold); text-shadow:3px 3px 0 rgba(0,0,0,.4); }
  .sub { font-size:1.05rem; font-weight:600; }
  .info { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:16px 0; }
  .info div { background:rgba(0,0,0,.4); border-radius:12px; padding:8px; font-size:.75rem; color:var(--soft); }
  .info b { display:block; font-size:1.05rem; color:var(--ink); }
  .info .wide { grid-column:span 2; }
  .grid { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
  .n { aspect-ratio:1; display:grid; place-items:center; background:#fff; color:var(--bg); border-radius:6px; font-weight:800; font-size:clamp(.7rem,3.2vw,1rem); position:relative; }
  .n.apartado { background:var(--gold); }
  .n.vendido { background:#0b2a20; color:#4c7a68; }
  .n.vendido::after { content:'✕'; position:absolute; color:var(--red); font-size:1.6em; }
  .legend { display:flex; justify-content:center; gap:14px; margin:10px 0 4px; font-size:.75rem; color:var(--soft); }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; }
  .quedan { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; color:var(--gold); margin-top:6px; }
  .fine { font-size:.68rem; color:var(--soft); margin-top:8px; }
</style>
</head>
<body>
<main class="banner">
  <span class="tag">🎄 RIFA NAVIDEÑA 🎄</span>
  <h1>GANA <span id="premio"></span></h1>
  <p class="sub">Boleta: <b id="precio"></b> · 100 números (00 al 99)</p>

  <section class="info">
    <div class="wide">Juega con las 2 últimas cifras del premio mayor de la<b id="loteria"></b></div>
    <div class="wide">Responsable: <b id="loteria">Samuel Romero</b></div>
    <div>Sorteo<b id="sorteo"></b></div>
    <div>Entrega del premio<b id="entrega"></b></div>
  </section>

  <div class="grid" id="grid"></div>
  <div class="legend">
    <span><i style="background:#fff"></i>Disponible</span>
    <span><i style="background:var(--gold)"></i>Apartado</span>
    <span><i style="background:#0b2a20;border:1px solid var(--red)"></i>Vendido</span>
  </div>
  <p class="quedan" id="quedan"></p>
  <p class="fine" id="regla"></p>
</main>
<button id="descargar">📥 Descargar tablero como imagen</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  // Los datos vienen de la hoja "Web" de la Hoja de Google "rifa_celular" (publicada como CSV). No edites aquí.
  const HOJA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-wFyrz0Xrt6VTfiqwE0WToggF4GIuW1U64KKrCeZxQMH7eV35dQhvzs_rkm6NrRwhMPhc6nywvvK/pub?gid=159417971&single=true&output=csv';
  const $ = id => document.getElementById(id);
  const filaCSV = linea => {
    const out = []; let cur = '', q = false;
    for (const c of linea) {
      if (c === '"') q = !q;
      else if (c === ',' && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    return [...out, cur].map(s => s.trim());
  };
  const leerHoja = texto => {
    const d = { vendidos: [], apartados: [] };
    for (const [a, b = ''] of texto.split(/\r?\n/).map(filaCSV)) {
      if (/^\d{1,2}$/.test(a)) {
        const n = a.padStart(2, '0'), e = b.toLowerCase();
        if (e === 'pagado') d.vendidos.push(n);
        else if (e === 'apartado') d.apartados.push(n);
      } else if (['premio', 'precio'].includes(a)) d[a] = b.replace(/\D/g, '');
      else if (['loteria', 'sorteo', 'regla'].includes(a)) d[a] = b;
    }
    return d;
  };
  const pesos = v => '$' + Number(v).toLocaleString('es-CO');
  const dia = (iso, sumar = 0) => {
    const d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + sumar);
    const s = d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
    return s[0].toUpperCase() + s.slice(1).replace(',', '');
  };

  fetch(HOJA + '&v=' + Date.now()).then(r => r.text()).then(leerHoja).then(d => {
    $('premio').textContent = pesos(d.premio);
    $('precio').textContent = pesos(d.precio);
    $('loteria').textContent = d.loteria;
    $('sorteo').textContent = dia(d.sorteo);
    $('entrega').textContent = dia(d.sorteo, 1);
    $('regla').textContent = `Si el número ganador no se vende, ${d.regla[0].toLowerCase() + d.regla.slice(1)}. El premio se entrega el día siguiente al sorteo.`;
    for (let i = 0; i < 100; i++) {
      const n = String(i).padStart(2, '0');
      const el = document.createElement('div');
      el.className = 'n' + (d.vendidos.includes(n) ? ' vendido' : d.apartados.includes(n) ? ' apartado' : '');
      el.textContent = n;
      $('grid').appendChild(el);
    }
    const libres = 100 - new Set([...d.vendidos, ...d.apartados]).size;
    $('quedan').textContent = libres ? `¡Quedan ${libres} números!` : '¡AGOTADA! Gracias 🙌';
  });

  $('descargar').onclick = async () => {
    await document.fonts.ready;
    const canvas = await html2canvas(document.querySelector('.banner'), {
      scale: 2, backgroundColor: '#0f3d2e',
      onclone: doc => { doc.querySelector('.banner').style.boxShadow = 'none'; } // html2canvas pinta mal la sombra
    });
    const a = document.createElement('a');
    a.download = 'tablero-rifa.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
</script>
</body>
</html>
